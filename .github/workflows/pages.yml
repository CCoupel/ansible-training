name: pages

# Déploiement du site HTML sur GitHub Pages (source : GitHub Actions, build_type=workflow).
# - appelé par release.yml après la publication d'une release (workflow_call)
# - ou lancé manuellement (workflow_dispatch)
# - seuls les fichiers du site sont publiés (rien de docs/, tests/, tools/, .claude/, _work/) ;
#   en mode workflow (build_type=workflow) Jekyll n'est pas exécuté : pas de .nojekyll nécessaire
#   (upload-pages-artifact exclut de toute façon les fichiers cachés)
# - le site publié est celui de la ref appelante : main pour un lancement manuel, le tag pour un appel
#   depuis release.yml. Un rattrapage d'une release ancienne depuis main publierait donc le contenu de main.
# - ce workflow ne fait PAS de scan anti-fuite (LEAK_PATTERNS) : il repose sur celui de release.yml.
#   Avant un premier lancement manuel (workflow_dispatch), lancer tests/site/check_site.py et
#   tests/slides/check_pptx.py avec LEAK_PATTERNS sur les fichiers à publier.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Installer Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Valider le site
        run: node tools/validate.js --strict-i18n

      - name: Préparer l'artefact (uniquement les fichiers du site)
        run: |
          mkdir _site
          cp -r index.html assets modules examples labs _site/
          cp "Ansible Training.pptx" _site/

      - name: Envoyer l'artefact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
