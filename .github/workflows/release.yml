name: release

# Publication du support de formation sur la release GitHub du tag vX.Y.Z.
# - tag poussé (v*.*.*) ou lancement manuel (input `tag`, ex. rattrapage de v0.1.0)
# - assets par release : le PPTX, le zip du site HTML (build/Ansible-Training-HTML.zip, tools/package.js) et sa somme .sha256
# - les scans anti-fuite (tests/slides/check_pptx.py, tests/site/check_site.py) sont bloquants : sans secret
#   LEAK_PATTERNS, aucune publication
# - ne jamais afficher un terme interdit dans les logs (dépôt public)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à publier (ex. v0.1.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Artefacts à publier, un par ligne : <fichier source>|<asset>  (${TAG} remplacé à l'exécution).
      # Chaque ligne doit avoir son cas dans l'étape « Contrôles » (sinon échec). Le zip HTML est produit par
      # l'étape « Construire le zip HTML » (déterministe, depuis les fichiers suivis par git du tag).
      ARTIFACTS: |
        Ansible Training.pptx|Ansible-Training-${TAG}.pptx
        build/Ansible-Training-HTML.zip|Ansible-Training-HTML-${TAG}.zip
    steps:
      - name: Valider le tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag invalide (attendu vX.Y.Z)"
            exit 1
          fi

      - name: Checkout du tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
          fetch-depth: 0

      - name: Vérifier que le tag est posé sur main
        run: |
          # Garde-fou : on ne publie que les tags dont le commit est dans l'historique de main
          # (valable aussi pour workflow_dispatch).
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          COMMIT=$(git rev-list -n 1 "refs/tags/$TAG")
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "::error::Le tag $TAG n'est pas sur main : merge d'abord la branche milestone sur main puis retag"
            exit 1
          fi
          echo "Tag $TAG sur main : OK"

      - name: Vérifier la présence du secret LEAK_PATTERNS
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          if [ -z "${LEAK_PATTERNS//[[:space:]]/}" ]; then
            echo "::error::Secret LEAK_PATTERNS absent ou vide : publication refusée (scan anti-fuite incomplet)"
            exit 1
          fi

      - name: Installer Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Installer Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Tests du site et de l'obsolescence (bloquants)
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          CI: 'true'
          PARITY_STRICT: '1'
          LOTS_STRICT: '1'
          I18N_STRICT: '1'
          RELEASE_TAG: ${{ env.TAG }}
        run: |
          # RELEASE_TAG active les contrôles de version (slide 2 et assets/meta.js affichent X.Y.Z du tag).
          python3 -m unittest discover -s tests/site
          python3 -m unittest discover -s tests/slides/obsolescence

      - name: Valider le site et assets/meta.js
        run: |
          node tools/validate.js --strict-i18n
          # meta.js est commité (le site s'ouvre en double-clic) : il doit déjà correspondre au tag.
          # Aucune régénération en CI (le zip est construit depuis des fichiers commités uniquement).
          node tools/sync-meta.js --check --version "${TAG#v}"

      - name: Construire le zip HTML
        run: |
          # Refuse un arbre modifié ; entrées triées, dates fixes : même commit -> même sha256.
          node tools/package.js
          unzip -t build/Ansible-Training-HTML.zip > /dev/null
          sha256sum build/Ansible-Training-HTML.zip

      - name: Contrôles (validité + anti-fuite + version)
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          CI: 'true'
        run: |
          # Un contrôle par type d'artefact, chemin pris dans ARTIFACTS (pas de chemin en dur).
          # check_pptx.py : sortie = fichier XML + numéro de motif, jamais le texte trouvé.
          # Les attendus (nombre de slides, slides masquées) sont gérés par check_pptx.py
          # (tests/slides/expected.json) : le workflow n'a rien à adapter si ces valeurs changent.
          # Zip HTML : archive valide, PPTX embarqué identique à celui du tag, assets/meta.js à la version du tag
          # et à la date de la slide 2,
          # puis check_site.py (anti-fuite du contenu du zip, extrait dans un répertoire temporaire) et check_pptx.py
          # sur le PPTX embarqué. --require-secret : échec si LEAK_PATTERNS absent.
          while IFS='|' read -r src asset; do
            [ -z "$src" ] && continue
            case "$src" in
              *.pptx)
                python3 tests/slides/check_pptx.py "$src"
                python3 - "$src" <<'PY'
          import os, re, sys
          sys.path.insert(0, "tests/slides")
          from pptx_reader import Deck

          tag = os.environ["TAG"]
          version = tag.lstrip("v")
          try:
              text = Deck(sys.argv[1]).slide(2).text
          except Exception:
              print("::error::Lecture de la slide 2 impossible (PPTX invalide ?)")
              sys.exit(1)
          if re.search(r"(?<![\d.])" + re.escape(version) + r"(?![\d.])", text):
              print("Version slide 2 : OK")
          else:
              print("::error::La slide 2 n'affiche pas la version " + tag)
              sys.exit(1)
          if re.search(r"(?<!\d)\d{2}/\d{2}/\d{4}(?!\d)", text):
              print("Date slide 2 : OK")
          else:
              print("::error::La slide 2 n'affiche pas de date de livraison (JJ/MM/AAAA)")
              sys.exit(1)
          PY
                ;;
              *.zip)
                unzip -t "$src" > /dev/null
                TMP=$(mktemp -d)
                unzip -q "$src" -d "$TMP"
                for f in index.html assets/meta.js "Ansible Training.pptx"; do
                  if [ ! -f "$TMP/$f" ]; then
                    echo "::error::Zip HTML incomplet : fichier attendu absent ($f)"
                    exit 1
                  fi
                done
                if ! cmp -s "$TMP/Ansible Training.pptx" "Ansible Training.pptx"; then
                  echo "::error::Le PPTX embarqué dans le zip diffère de celui du tag"
                  exit 1
                fi
                if ! grep -Fq "\"version\": \"${TAG#v}\"" "$TMP/assets/meta.js"; then
                  echo "::error::assets/meta.js du zip n'affiche pas la version $TAG"
                  exit 1
                fi
                if ! grep -Eq '"date": "[0-9]{2}/[0-9]{2}/[0-9]{4}"' "$TMP/assets/meta.js"; then
                  echo "::error::assets/meta.js sans date de livraison (JJ/MM/AAAA)"
                  exit 1
                fi
                python3 - "$TMP" <<'PY'
          import os, re, sys
          sys.path.insert(0, "tests/slides")
          from pptx_reader import Deck

          tmp = sys.argv[1]
          meta = open(os.path.join(tmp, "assets", "meta.js"), encoding="utf-8").read()
          m = re.search(r'"date":\s*"(\d{2}/\d{2}/\d{4})"', meta)
          try:
              text = Deck(os.path.join(tmp, "Ansible Training.pptx")).slide(2).text
          except Exception:
              print("::error::Lecture de la slide 2 du PPTX embarqué impossible")
              sys.exit(1)
          dates = re.findall(r"(?<!\d)\d{2}/\d{2}/\d{4}(?!\d)", text)
          if m and m.group(1) in dates:
              print("Date de livraison (meta.js = slide 2) : OK")
          else:
              print("::error::La date de assets/meta.js diffère de celle de la slide 2")
              sys.exit(1)
          PY
                python3 tests/site/check_site.py --dir "$TMP" --require-secret
                python3 tests/slides/check_pptx.py "$TMP/Ansible Training.pptx"
                rm -rf "$TMP"
                ;;
              *)
                echo "::error::Aucun contrôle défini pour cet artefact"
                exit 1
                ;;
            esac
          done <<< "$ARTIFACTS"

      - name: Préparer les assets
        run: |
          mkdir -p dist-release
          while IFS='|' read -r src asset; do
            [ -z "$src" ] && continue
            asset="${asset//\$\{TAG\}/$TAG}"
            cp "$src" "dist-release/$asset"
            case "$asset" in
              *.zip)
                # Somme de contrôle (format sha256sum, nom d'asset publié) : `sha256sum -c <asset>.sha256`
                # dans le dossier contenant le zip téléchargé.
                (cd dist-release && sha256sum "$asset" > "$asset.sha256")
                ;;
            esac
          done <<< "$ARTIFACTS"
          ls -1 dist-release

      - name: Créer ou mettre à jour la release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG existante : assets remplacés (--clobber) :"
            ls -1 dist-release
            gh release upload "$TAG" dist-release/* --clobber --repo "$REPO"
          else
            NOTES=""
            if [ -f CHANGELOG.md ]; then
              # En-tête exact `## [X.Y.Z]` ou `## X.Y.Z` (suffixe éventuel après un espace ou `]`)
              NOTES=$(V="${TAG#v}" awk '
                BEGIN { v = ENVIRON["V"] }
                /^## / {
                  if (found) exit
                  h = $2; gsub(/[\[\]]/, "", h)
                  if (h == v) { found = 1; next }
                }
                found { print }' CHANGELOG.md)
            fi
            if [ -n "${NOTES//[[:space:]]/}" ]; then
              printf '%s\n' "$NOTES" > release-notes.md
              gh release create "$TAG" dist-release/* --title "$TAG" --notes-file release-notes.md --verify-tag --repo "$REPO"
            else
              gh release create "$TAG" dist-release/* --title "$TAG" --generate-notes --verify-tag --repo "$REPO"
            fi
          fi

  # Mise en ligne du site GitHub Pages après la release (même méthode qu'openshift-course).
  # Les permissions ci-dessous bornent celles du workflow appelé.
  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
