<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="course.title"></title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="app">
  <div id="scrim"></div>
  <aside id="sidebar" data-i18n-attr="aria-label:nav.sidebar">
    <div class="side-head">
      <a href="#home" class="brand"><span class="logo">🅰️</span> <span data-i18n="course.brand"></span><small data-i18n="course.subtitle"></small></a>
      <input id="search" type="search" data-i18n-attr="placeholder:search.placeholder,aria-label:search.aria">
    </div>
    <nav id="navlist"></nav>
  </aside>
  <main id="main">
    <header id="topbar">
      <button id="menu" data-i18n-attr="title:nav.menu,aria-label:nav.sidebar">☰</button>
      <div id="crumb" aria-live="polite"></div>
      <span id="counter"></span>
      <button id="notes-btn" type="button" aria-pressed="false" hidden data-i18n-attr="title:nav.notesAria,aria-label:nav.notesAria"><span data-i18n="nav.notes"></span></button>
      <button id="theme" data-i18n-attr="title:nav.theme,aria-label:nav.themeAria">🌓</button>
    </header>
    <div id="progress"><i></i></div>
    <section id="slide" tabindex="-1"></section>
    <footer id="nav">
      <button id="prev" data-i18n="nav.prev"></button>
      <span id="hint" data-i18n="nav.hint"></span>
      <button id="next" data-i18n="nav.next"></button>
    </footer>
  </main>
</div>

<script src="assets/meta.js"></script>
<script src="assets/engine.js"></script>
<script src="assets/i18n/fr.js"></script>
<script src="assets/plan.js"></script>
<script src="modules/m01-introduction.js"></script>
<script src="modules/m02-inventory.js"></script>
<script src="modules/m03-playbooks.js"></script>
<script src="modules/m04-modules.js"></script>
<script src="modules/m05-variables-facts.js"></script>
<script src="modules/m06-errors-delegation.js"></script>
<script src="modules/m07-filters-conditions.js"></script>
<script src="modules/m08-loops-tags.js"></script>
<script>COURSE.start();</script>
</body>
</html>
